# Von scripts/caddy-scan/setup-on-s1.sh nach /etc/tmpfiles.d/ installiert.
# Legt das Caddy-Anfrage-Log beim Booten an, falls es fehlt (bestehende
# Dateien bleiben unveraendert): fail2ban startet nicht, wenn die Logdatei
# eines aktiven Jails (caddy-scan) nicht existiert - dann waeren auch die
# Jails sshd und postgresql aus.
f /var/log/caddy/requests.log 0600 caddy caddy -
