# fail2ban-Jail caddy-scan (von scripts/caddy-scan/setup-on-s1.sh nach
# /etc/fail2ban/jail.d/caddy-scan.conf installiert).
#
# Sperrt eine Adresse fuer 24 Stunden auf den Web-Ports, wenn sie binnen
# 10 Minuten dreimal einen Scanner-Pfad abruft (Filter caddy-scan). Nur 80
# und 443, nicht alle Ports: SSH, Mail und der WireGuard-Tunnel einer
# faelschlich gesperrten Adresse bleiben erreichbar. ignoreip kommt aus
# [DEFAULT] in jail.local (Workstation, Docker-Netze, localhost).
#
# backend: [DEFAULT] steht auf s1 auf systemd, eine Datei braucht polling
# (wie das postgresql-Jail). action_: nur sperren, keine Mail je Sperre -
# Scanner kommen dutzendfach pro Woche.
#
# Die Logdatei muss beim Start von fail2ban existieren, sonst startet
# fail2ban gar nicht; dafuer sorgt /etc/tmpfiles.d/caddy-requests.conf.
#
# Entsperren: sudo fail2ban-client set caddy-scan unbanip <Adresse>

[caddy-scan]
enabled  = true
filter   = caddy-scan
backend  = polling
logpath  = /var/log/caddy/requests.log
port     = http,https
protocol = tcp
maxretry = 3
findtime = 600
bantime  = 86400
action   = %(action_)s
