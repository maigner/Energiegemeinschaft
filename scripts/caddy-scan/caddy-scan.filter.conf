# fail2ban-Filter caddy-scan (von scripts/caddy-scan/setup-on-s1.sh nach
# /etc/fail2ban/filter.d/caddy-scan.conf installiert).
#
# Trifft Anfragen im Caddy-Anfrage-Log (/var/log/caddy/requests.log, JSON,
# siehe requestlog.caddy), deren Pfad es auf keinem unserer Dienste gibt und
# den nur Scanner abrufen: herumliegende Zugangsdaten (.env, .git, .aws),
# WordPress, phpMyAdmin, bekannte Geraete- und Framework-Luecken.
#
# Bewusst NICHT: 404 oder 401 an sich. Mitglied und Anlage (Pi) teilen sich
# eine Adresse - ein Tippfehler oder ein Pi mit einem Fehler duerfte nie den
# ganzen Haushalt aussperren. Neue Muster nur aufnehmen, wenn es den Pfad
# auf keinem Host hinter Caddy geben kann (Website, mailcow/SOGo, Nextcloud,
# Keila, openHAB-Cloud).
#
# Die Zeile ist bis zur Adresse fest verankert: remote_ip schreibt Caddy
# selbst aus der TCP-Verbindung, alles vom Client Bestimmte (Host, Pfad)
# steht dahinter und ist JSON-maskiert, eine fremde Adresse laesst sich so
# nicht unterschieben.
#
# fail2ban schneidet den erkannten Zeitstempel ("ts":<Epoch>) vor dem
# Abgleich aus der Zeile; uebrig bleiben hoechstens ein paar Ziffern der
# Nachkommastellen, deshalb steht an der Stelle nur [\d.]*.
#
# Pruefen: fail2ban-regex /var/log/caddy/requests.log caddy-scan

[Definition]

_scan = (?:/\.env|/\.git/|/\.aws/|/\.ssh/|/\.svn/|/\.npmrc|/\.DS_Store|/\.vscode/|/\.htpasswd|/wp-login\.php|/wp-admin|/wp-content/|/wp-includes/|/xmlrpc\.php|/wlwmanifest\.xml|/phpinfo\.php|/phpmyadmin|/pma/|/vendor/phpunit|/eval-stdin\.php|/cgi-bin/|/actuator/|/boaform/|/HNAP1)

failregex = (?i)^\{"level":"\w+",(?:"ts":)?[\d.]*,"logger":"[^"]*","msg":"handled request","request":\{"remote_ip":"<ADDR>","remote_port":"\d+","client_ip":"[^"]*","proto":"[^"]*","method":"[A-Z]+","host":"[^"]*","uri":"(?:[^"\\]|\\.)*?%(_scan)s

# Nextcloud-Clients synchronisieren auch versteckte Dateien und Ordner
# (.git, .env, .DS_Store) - WebDAV- und index.php-Pfade zaehlen nie.
ignoreregex = "uri":"/(?:remote|public|index)\.php/

datepattern = "ts":{EPOCH}
