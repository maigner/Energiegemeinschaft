version: 1
# ============================================================================
# IBM - Uebersichtsseite fuer die Main UI
#
# Wird von setup/05-install-overview.sh per REST API installiert; dafuer
# wandelt build-dist.sh diese Datei beim Paketbau nach overview.page.json.
# Das Ladestands-Item (INVERTER_SOC_PLACEHOLDER aus profile.sh) wird dabei
# durch das SOC_ITEM der Anlage ersetzt.
#
# Manuell einspielen geht weiterhin:
#   Settings -> Pages -> Overview -> Code-Ansicht -> Inhalt von
#   pages.overview einfuegen
#
# Zeigt und bedient alle Items, die das Batteriemanagement steuert. Jede
# Karte traegt eine Erklaerung (footer), damit die Seite ohne Vorwissen
# verstaendlich ist; Feineinstellungen stehen unter "Fuer Experten".
# ============================================================================
pages:
  overview:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Overview
    slots:
      default:
        # --- Was macht IBM? -------------------------------------------------
        - component: oh-block
          config: {}
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-card
                            config:
                              title: ISCHLSTROM Batteriemanagement (IBM)
                            slots:
                              content:
                                - component: Label
                                  config:
                                    text: >-
                                      IBM steuert die Batterie so, dass möglichst
                                      viel Sonnenstrom in der Energiegemeinschaft
                                      bleibt: Vor sonnigen Vormittagen wird nachts
                                      nicht unnötig aus dem Netz geladen, und am
                                      Abend speist die Batterie ein, solange die
                                      Gemeinschaft mehr Strom verbraucht als
                                      erzeugt. Wettervorhersage und
                                      Überschuss-Zeiten holt sich die Anlage
                                      automatisch von ischlstrom.org. Die
                                      Voreinstellungen passen für die meisten
                                      Anlagen.
                                    style:
                                      padding: 16px
                                      white-space: normal
                                      line-height: 1.5

        # --- Aktueller Zustand ----------------------------------------------
        - component: oh-block
          config:
            title: Aktueller Zustand
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Ladestand der Batterie
                              item: Fronius_Symo_Inverter_Battery_State_of_Charge
                              footer: >-
                                Wie voll die Batterie gerade ist. Tippen zeigt
                                den Verlauf.
                              action:
                                - analyzer
                              actionAnalyzerItems:
                                - Fronius_Symo_Inverter_Battery_State_of_Charge
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Bewölkung am Vormittag
                              item: Ischlstrom_Wolkenvorschau
                              footer: >-
                                Vorhersage in Prozent: 0 % = wolkenlos,
                                100 % = bedeckt. Kommt stündlich von
                                ischlstrom.org.
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Überschuss ab
                              item: Ischlstrom_Crossover_Start
                              footer: >-
                                Ab dieser Uhrzeit erzeugt die Gemeinschaft mehr
                                Strom, als sie verbraucht - die Einspeisung aus
                                der Batterie endet.
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Überschuss bis
                              item: Ischlstrom_Crossover_Ende
                              footer: >-
                                Ab dieser Uhrzeit verbraucht die Gemeinschaft
                                wieder mehr, als sie erzeugt - die Batterie
                                beginnt am Abend einzuspeisen.

        # --- Hauptschalter ---------------------------------------------------
        - component: oh-block
          config:
            title: Steuerung
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Batteriemanagement aktivieren
                              item: Schalte_ISCHLSTROM_Empfehlung_einaus
                              color: green
                              footer: "=items.Schalte_ISCHLSTROM_Empfehlung_einaus.state === 'ON' ? '🟢 EINGESCHALTET - IBM steuert die Batterie automatisch.' : (items.Schalte_ISCHLSTROM_Empfehlung_einaus.state === 'OFF' ? '⚪ AUSGESCHALTET - IBM greift nicht ein, der Wechselrichter arbeitet wie ab Werk.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"

        # --- Laden bei Sonnenprognose ----------------------------------------
        - component: oh-block
          config:
            title: Laden bei Sonnenprognose
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Ladesperre verwenden
                              item: IBM_LADESPERRE_AKTIV
                              color: blue
                              footer: "=items.IBM_LADESPERRE_AKTIV.state === 'ON' ? '🟢 EINGESCHALTET - An sonnigen Tagen wird zwischen den unten angezeigten Zeiten nicht geladen; die Batterie füllt sich danach aus dem Mittags-Überschuss der Gemeinschaft.' : (items.IBM_LADESPERRE_AKTIV.state === 'OFF' ? '⚪ AUSGESCHALTET - Das Laden wird nie gesperrt.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Sperre ab
                              item: Ischlstrom_Ladesperre_Start
                              footer: >-
                                Erster Sonnenschein laut Tagesprognose - kommt
                                automatisch von ischlstrom.org. "-" bedeutet:
                                heute keine Sperre.
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Sperre bis
                              item: Ischlstrom_Ladesperre_Ende
                              footer: >-
                                Ab dieser Uhrzeit erzeugt die Gemeinschaft laut
                                Prognose mehr, als sie verbraucht - dann darf
                                die Batterie den Überschuss aufnehmen.
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Bewölkungs-Schwelle (%)
                              item: IBM_LADESPERRE_WOLKEN_SCHWELLE
                              min: 0
                              max: 100
                              step: 5
                              footer: >-
                                Nur wenn die Bewölkungsvorhersage unter diesem
                                Wert liegt (also genug Sonne kommt), wird das
                                Laden gesperrt.

        # --- Einspeisen am Abend ---------------------------------------------
        - component: oh-block
          config:
            title: Einspeisen am Abend
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Entladung verwenden
                              item: IBM_ENTLADUNG_AKTIV
                              color: blue
                              footer: "=items.IBM_ENTLADUNG_AKTIV.state === 'ON' ? '🟢 EINGESCHALTET - Die Batterie speist am Abend ins Netz ein, solange die Gemeinschaft mehr verbraucht als erzeugt (Überschuss-Zeiten oben). Liegen keine Überschuss-Zeiten vor, wird nicht eingespeist.' : (items.IBM_ENTLADUNG_AKTIV.state === 'OFF' ? '⚪ AUSGESCHALTET - Es wird nicht automatisch eingespeist.' : 'Zustand noch unbekannt - openHAB startet vermutlich gerade.')"
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Reserve-Ladestand (%)
                              item: IBM_MIN_BATTERY_CHARGE
                              min: 10
                              max: 90
                              step: 5
                              footer: >-
                                Unter diesem Ladestand stoppt die Einspeisung -
                                diese Reserve bleibt für den eigenen Haushalt.

        # --- Fuer Experten ---------------------------------------------------
        - component: oh-block
          config:
            title: Für Experten
          slots:
            default:
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Minimale Entladeleistung (W)
                              item: Minimale_Entladeleistung_Batterieeinspeisung
                              min: 0
                              max: 1000
                              step: 100
                              footer: >-
                                Kleinste Leistung, mit der eingespeist wird -
                                auch wenn die Wolkenvorschau veraltet ist.
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Maximale Entladeleistung (W)
                              item: Maximale_Entladeleistung_Batterieeinspeisung
                              min: 1000
                              max: 4000
                              step: 500
                              footer: >-
                                Obergrenze fürs Einspeisen. Die Vorgabe passt
                                für die meisten Anlagen.
