version: 1
# ============================================================================
# IBM - Uebersichtsseite fuer die Main UI
#
# Wird von setup/05-install-overview.sh per REST API installiert; dafuer
# wandelt build-dist.sh diese Datei beim Paketbau nach overview.page.json.
# Das Ladestands-Item (INVERTER_SOC_PLACEHOLDER aus profile.sh) wird dabei
# durch das SOC_ITEM der Anlage ersetzt.
#
# Manuell einspielen geht weiterhin:
#   Settings -> Pages -> Overview -> Code-Ansicht -> Inhalt von
#   pages.overview einfuegen
#
# Zeigt und bedient alle Items, die das Batteriemanagement steuert.
# ============================================================================
pages:
  overview:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      label: Overview
    slots:
      default:
        - component: oh-block
          config: {}
          slots:
            default:
              # --- Status -------------------------------------------------
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Ladestand Batterie
                              item: Fronius_Symo_Inverter_Battery_State_of_Charge
                              action:
                                - analyzer
                              actionAnalyzerItems:
                                - Fronius_Symo_Inverter_Battery_State_of_Charge
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Bewölkungsvorhersage
                              item: Ischlstrom_Wolkenvorschau
                              footer: Bewölkungsgrad zwischen 0% und 100%
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Überschuss ab
                              item: Ischlstrom_Crossover_Start
                              footer: Zeit, ab der die Energiegemeinschaft im Wochenschnitt mehr erzeugt als verbraucht
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-label-card
                            config:
                              title: Überschuss bis
                              item: Ischlstrom_Crossover_Ende
                              footer: Zeit, ab der wieder mehr verbraucht als erzeugt wird

              # --- Hauptschalter ------------------------------------------
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Batteriemanagement aktivieren
                              item: Schalte_ISCHLSTROM_Empfehlung_einaus
                              color: green

              # --- Ladesperre am Vormittag --------------------------------
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Ladesperre bei Sonnenprognose
                              item: IBM_LADESPERRE_AKTIV
                              color: blue
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Ladesperre ab (Stunde)
                              item: IBM_LADESPERRE_START
                              min: 0
                              max: 23
                              step: 1
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Ladesperre bis (Stunde)
                              item: IBM_LADESPERRE_ENDE
                              min: 0
                              max: 23
                              step: 1
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Wolken-Schwelle Ladesperre
                              footer: unter diesem Bewölkungsgrad wird das Laden aus dem Netz gesperrt
                              item: IBM_LADESPERRE_WOLKEN_SCHWELLE
                              min: 0
                              max: 100
                              step: 5

              # --- Forcierte Entladung ------------------------------------
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-toggle-card
                            config:
                              title: Forcierte Entladung nachts
                              item: IBM_ENTLADUNG_AKTIV
                              color: blue
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Entladung ab (Stunde)
                              item: IBM_ENTLADUNG_START
                              min: 0
                              max: 23
                              step: 1
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Entladung bis (Stunde)
                              item: IBM_ENTLADUNG_ENDE
                              min: 0
                              max: 23
                              step: 1
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Minimaler Ladestand Batterie
                              footer: bei diesem Ladestand wird die Einspeisung aus der Batterie beendet
                              item: IBM_MIN_BATTERY_CHARGE
                              min: 10
                              max: 90
                              step: 5
              - component: oh-grid-row
                config: {}
                slots:
                  default:
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Minimale Entladeleistung Batterieeinspeisung
                              item: Minimale_Entladeleistung_Batterieeinspeisung
                              min: 0
                              max: 1000
                              step: 100
                    - component: oh-grid-col
                      config: {}
                      slots:
                        default:
                          - component: oh-stepper-card
                            config:
                              title: Maximale Entladeleistung Batterieeinspeisung
                              item: Maximale_Entladeleistung_Batterieeinspeisung
                              min: 1000
                              max: 4000
                              step: 500
