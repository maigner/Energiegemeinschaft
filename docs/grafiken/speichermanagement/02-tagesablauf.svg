<text x="80" y="92" font-size="56" fill="#23262b" text-anchor="start" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Ein Tag mit Speichermanagement</text><text x="307" y="185" font-size="22" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">Nacht</text><text x="1340" y="185" font-size="22" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">Nacht</text><text x="140" y="140" font-size="24" fill="#23262b" text-anchor="start" font-weight="700" fill-opacity="1">Die Gemeinschaft: Erzeugung und Verbrauch</text><text x="810" y="290" font-size="24" fill="#e08a1e" text-anchor="middle" font-weight="700" fill-opacity="1">Überschuss</text><text x="810" y="318" font-size="22" fill="#e08a1e" text-anchor="middle" font-weight="400" fill-opacity="1">versorgt die Nachbarn</text><text x="307" y="322" font-size="22" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Bedarf</text><text x="1355" y="290" font-size="22" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Bedarf der Gemeinschaft</text><text x="140" y="500" font-size="24" fill="#23262b" text-anchor="start" font-weight="700" fill-opacity="1">Eine Batterie im Haushalt: Füllstand</text><text x="126" y="546" font-size="18" fill="#8a9097" text-anchor="end" font-weight="400" fill-opacity="1">voll</text><text x="126" y="746" font-size="18" fill="#8a9097" text-anchor="end" font-weight="400" fill-opacity="1">leer</text><text x="330" y="727" font-size="21" fill="#2f8a3c" text-anchor="middle" font-weight="400" fill-opacity="1">Reserve fürs Haus bleibt</text><text x="880" y="722" font-size="21" fill="#2f8a3c" text-anchor="middle" font-weight="400" fill-opacity="1">lädt gedrosselt, nur aus eigener PV</text><text x="1140" y="520" font-size="21" fill="#2f8a3c" text-anchor="middle" font-weight="400" fill-opacity="1">voll zum Sonnenuntergang</text><text x="1360" y="698" font-size="21" fill="#2f8a3c" text-anchor="middle" font-weight="400" fill-opacity="1">speist in die Gemeinschaft,</text><text x="1360" y="724" font-size="21" fill="#2f8a3c" text-anchor="middle" font-weight="400" fill-opacity="1">solange sie Strom braucht</text><text x="1150" y="470" font-size="22" fill="#2f8a3c" text-anchor="middle" font-weight="700" fill-opacity="1">Batterien decken den Nachtbedarf</text><text x="140" y="782" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">0 Uhr</text><text x="475" y="782" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">6</text><text x="810" y="782" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">12</text><text x="1145" y="782" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">18</text><text x="1480" y="782" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">24 Uhr</text><text x="202" y="841" font-size="21" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">PV-Erzeugung</text><text x="435.2" y="841" font-size="21" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Verbrauch</text><text x="636.5999999999999" y="841" font-size="21" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Batterie mit Speichermanagement</text><text x="1071.1999999999998" y="841" font-size="21" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Batterie ohne Steuerung (bisher)</text>
