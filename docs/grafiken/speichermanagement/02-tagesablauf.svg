<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Tagesablauf: Tagsueber laedt die Batterie gedrosselt aus der eigenen PV, der Ueberschuss der Gemeinschaft versorgt die Nachbarn; zum Sonnenuntergang ist sie voll und speist nachts in die Gemeinschaft, solange diese Strom braucht; eine Reserve fuer das Haus bleibt." font-family="Kalam, 'Comic Relief', 'Segoe Print', 'Bradley Hand', cursive">
