 stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><rect x="240.0" y="502" width="30.0" height="8" rx="2" stroke="#23262b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><rect x="214" y="567" width="82" height="17" fill="#2f8a3c" fill-opacity="0.75" rx="3"/><rect x="214" y="546" width="82" height="17" fill="#2f8a3c" fill-opacity="0.75" rx="3"/><rect x="420" y="520" width="150" height="100" rx="8" stroke="#c8302b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><line x1="420" y1="570" x2="363.0" y2="570.0" stroke="#c8302b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="376.0,561.2 360,570 376.0,578.8" stroke="#c8302b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="1120" y1="560" x2="573.0" y2="560.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="586.0,551.2 570,560 586.0,568.8" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="570" y1="600" x2="1117.0" y2="600.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1104.0,608.8 1120,600 1104.0,591.2" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><path d="M740,622 A45,45 0 0 1 790,545 A50,50 0 0 1 880,530 A42,42 0 0 1 945,580 A30,30 0 0 1 940,622 Z" stroke="#23262b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="#fcfcfa"/><rect x="1120" y="480" width="420" height="220" rx="8" stroke="#23262b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="#fcfcfa"/><rect x="1120" y="250" width="190" height="120" rx="8" stroke="#1f5fb4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><rect x="1350" y="250" width="190" height="120" rx="8" stroke="#1f5fb4" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><line x1="1215" y1="370" x2="1215.0" y2="477.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1206.2,464.0 1215,480 1223.8,464.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="1445" y1="370" x2="1445.0" y2="477.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1436.2,464.0 1445,480 1453.8,464.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="1215" y1="700" x2="1215.0" y2="767.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1206.2,754.0 1215,770 1223.8,754.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="1445" y1="700" x2="1445.0" y2="767.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1436.2,754.0 1445,770 1453.8,754.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>
</g>
<text x="80" y="92" font-size="56" fill="#23262b" text-anchor="start" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Wie das Speichermanagement aufgebaut ist</text><text x="360" y="352" font-size="36" fill="#23262b" text-anchor="middle" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Haushalt eines Mitglieds</text><text x="255" y="440" font-size="24" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Wechselrichter</text><text x="255" y="470" font-size="24" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">+ Batterie</text><text x="495" y="556" font-size="24" fill="#c8302b" text-anchor="middle" font-weight="700" fill-opacity="1">Rechner</text><text x="495" y="583" font-size="19" fill="#c8302b" text-anchor="middle" font-weight="400" fill-opacity="1">(Raspberry Pi,</text><text x="495" y="606" font-size="19" fill="#c8302b" text-anchor="middle" font-weight="400" fill-opacity="1">ca. 150 €)</text><text x="360" y="664" font-size="22" fill="#c8302b" text-anchor="middle" font-weight="400" fill-opacity="1">steuert Laden und Entladen</text><text x="360" y="745" font-size="22" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">… und jede weitere Anlage, gleich aufgebaut</text><text x="842" y="590" font-size="24" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">Internet</text><text x="842" y="614" font-size="17" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">(verschlüsselt)</text><text x="842" y="500" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">holt sich Prognose und Wetter</text><text x="842" y="674" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">meldet den Zustand der Anlage, jede Minute</text><text x="1330" y="532" font-size="44" fill="#23262b" text-anchor="middle" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">ischlstrom.org</text><text x="1330" y="562" font-size="19" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">Server der Gemeinschaft</text><text x="1330" y="616" font-size="22" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Prognose je Viertelstunde:</text><text x="1330" y="648" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">Wie viel braucht die Gemeinschaft?</text><text x="1215" y="290" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="700" fill-opacity="1">Energiedaten</text><text x="1215" y="317" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">aller Mitglieder</text><text x="1215" y="343" font-size="17" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">(täglich, aus dem</text><text x="1215" y="363" font-size="17" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">Abrechnungssystem)</text><text x="1445" y="318" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="700" fill-opacity="1">Wettervorhersage</text><text x="1215" y="806" font-size="22" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Vorstand:</text><text x="1215" y="834" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">Dashboard und Alarme</text><text x="1445" y="806" font-size="22" fill="#23262b" text-anchor="middle" font-weight="700" fill-opacity="1">Mitglieder:</text><text x="1445" y="834" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">Monatsbericht und App</text>
</svg>
