<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Aufbau: Im Haushalt steuert ein kleiner Rechner den Wechselrichter mit Batterie; er holt Prognose und Wetter vom Server ischlstrom.org und meldet den Zustand zurueck. Der Server rechnet aus Energiedaten aller Mitglieder und Wettervorhersage die Prognose und informiert Vorstand und Mitglieder." font-family="Kalam, 'Comic Relief', 'Segoe Print', 'Bradley Hand', cursive">
