<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Regelkreis: Der Server rechnet die Prognose der Gemeinschaft, der Rechner im Haushalt entscheidet lokal und gibt dem Wechselrichter Befehle, die nur 5 Minuten gelten; Messwerte und Zustand fliessen zurueck. Sicherheitsnetz: Werksverhalten ohne Befehl, Betrieb wie ohne Steuerung ohne Internet, Hauptschalter beim Mitglied, Laden nur aus eigener PV." font-family="Kalam, 'Comic Relief', 'Segoe Print', 'Bradley Hand', cursive">
<style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap');</style>
<defs>
<filter id="wob" x="-3%" y="-3%" width="106%" height="106%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<radialGradient id="smudge"><stop offset="0" stop-color="#6b7280" stop-opacity="0.07"/><stop offset="1" stop-color="#6b7280" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="#fcfcfa"/>
<ellipse cx="1180" cy="240" rx="420" ry="150" fill="url(#smudge)"/>
<ellipse cx="420" cy="760" rx="380" ry="120" fill="url(#smudge)"/>
<rect x="9" y="9" width="1582" height="882" rx="14" fill="none" stroke="#c3c7cc" stroke-width="12"/>
<rect x="17" y="17" width="1566" height="866" rx="8" fill="none" stroke="#e4e6e9" stroke-width="2"/>
<g filter="url(#wob)">
<line x1="250" y1="215" x2="250.0" y2="297.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="241.2,284.0 250,300 258.8,284.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><rect x="100" y="300" width="300" height="220" rx="8" stroke="#23262b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><rect x="650" y="300" width="300" height="220" rx="8" stroke="#c8302b" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><rect x="1200" y="300" width="300" height="220" rx="8" stroke="#23262b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><line x1="400" y1="370" x2="647.0" y2="370.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="634.0,378.8 650,370 634.0,361.2" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="950" y1="370" x2="1197.0" y2="370.0" stroke="#c8302b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="1184.0,378.8 1200,370 1184.0,361.2" stroke="#c8302b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="1200" y1="450" x2="953.0" y2="450.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="966.0,441.2 950,450 966.0,458.8" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><line x1="650" y1="450" x2="403.0" y2="450.0" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="416.0,441.2 400,450 416.0,458.8" stroke="#1f5fb4" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><path d="M100,624 L410,627" stroke="#23262b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92" fill="none"/><polyline points="100,668 111,680 130,654" stroke="#2f8a3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="830,668 841,680 860,654" stroke="#2f8a3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="100,768 111,780 130,754" stroke="#2f8a3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/><polyline points="830,768 841,780 860,754" stroke="#2f8a3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.92"/>
</g>
<text x="80" y="92" font-size="52" fill="#23262b" text-anchor="start" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Wer entscheidet? Und was passiert bei einem Ausfall?</text><text x="250" y="170" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">Energiedaten aller Mitglieder</text><text x="250" y="198" font-size="22" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">+ Wettervorhersage</text><text x="250" y="352" font-size="40" fill="#23262b" text-anchor="middle" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">ischlstrom.org</text><text x="250" y="402" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">rechnet die Prognose</text><text x="250" y="432" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">der Gemeinschaft,</text><text x="250" y="462" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">je Viertelstunde</text><text x="800" y="352" font-size="40" fill="#23262b" text-anchor="middle" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Rechner</text><text x="800" y="380" font-size="19" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">im Haushalt</text><text x="800" y="426" font-size="22" fill="#c8302b" text-anchor="middle" font-weight="700" fill-opacity="1">entscheidet lokal:</text><text x="800" y="456" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">wann laden, wie schnell,</text><text x="800" y="486" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">wann einspeisen</text><text x="1350" y="352" font-size="40" fill="#23262b" text-anchor="middle" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Wechselrichter</text><text x="1350" y="380" font-size="19" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">+ Batterie</text><text x="1350" y="440" font-size="22" fill="#23262b" text-anchor="middle" font-weight="400" fill-opacity="1">führt den Befehl aus</text><text x="1350" y="490" font-size="18" fill="#8a9097" text-anchor="middle" font-weight="400" fill-opacity="1">Fronius, Sigenergy, Victron, …</text><text x="525" y="352" font-size="21" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">Prognose und Wetter</text><text x="1075" y="352" font-size="21" fill="#c8302b" text-anchor="middle" font-weight="400" fill-opacity="1">Befehl, gilt 5 Minuten</text><text x="1075" y="482" font-size="21" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">Messwerte</text><text x="525" y="482" font-size="21" fill="#1f5fb4" text-anchor="middle" font-weight="400" fill-opacity="1">Zustand, jede Minute</text><text x="100" y="612" font-size="40" fill="#23262b" text-anchor="start" font-weight="700" font-family="Caveat, Kalam, 'Segoe Print', cursive" fill-opacity="1">Das Sicherheitsnetz</text><text x="148" y="672" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Jeder Befehl gilt nur 5 Minuten. Kommt kein neuer,</text><text x="148" y="700" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">kehrt die Anlage von selbst zum Werksverhalten zurück.</text><text x="878" y="672" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Kein Internet oder keine Prognose?</text><text x="878" y="700" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Dann läuft die Batterie wie ohne Steuerung weiter.</text><text x="148" y="772" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Der Hauptschalter bleibt beim Mitglied,</text><text x="148" y="800" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">der eigene Haushalt hat immer Vorrang.</text><text x="878" y="772" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">Geladen wird nur aus der eigenen PV-Anlage,</text><text x="878" y="800" font-size="22" fill="#23262b" text-anchor="start" font-weight="400" fill-opacity="1">nie aus dem Netz.</text><text x="1500" y="866" font-size="19" fill="#8a9097" text-anchor="end" font-weight="400" fill-opacity="1">Open Source (EUPL-1.2), für andere Gemeinschaften übernehmbar</text>
</svg>
